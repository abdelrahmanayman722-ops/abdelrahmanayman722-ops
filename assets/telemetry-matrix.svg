<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050812" />
      <stop offset="50%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="33%" stop-color="#00bbf9" />
      <stop offset="68%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <!-- Cyan Bar Gradient -->
    <linearGradient id="cyanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00bbf9" />
    </linearGradient>

    <!-- Purple Bar Gradient -->
    <linearGradient id="purpleBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>

    <!-- Subtle Background Grid -->
    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="1" />
    </pattern>

    <!-- Glow Effect -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace; }
    .header-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 15px;
      fill: #f8fafc;
    }
    .header-sub {
      font-size: 10.5px;
      font-weight: 500;
      fill: #64748b;
      letter-spacing: 1.5px;
    }
    .panel-title {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #00f5d4;
    }
    .metric-label {
      font-size: 11px;
      fill: #cbd5e1;
      font-weight: 500;
    }
    .metric-val {
      font-size: 11px;
      font-weight: 700;
      fill: #00f5d4;
    }
    .metric-sub {
      font-size: 9.5px;
      fill: #64748b;
    }
    .verified-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #00f5d4;
    }
  </style>

  <!-- Card Background & Border -->
  <rect x="2" y="2" width="996" height="556" rx="12" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="1.75" />
  <rect x="2" y="2" width="996" height="556" rx="12" fill="url(#cardGrid)" />

  <!-- Header Area -->
  <g transform="translate(24, 28)">
    <!-- Status Indicator -->
    <circle cx="6" cy="6" r="4.5" fill="#00f5d4" filter="url(#neonGlow)" />
    <circle cx="6" cy="6" r="2" fill="#ffffff" />
    <text x="22" y="10" class="header-title">SYSTEMS ARCHITECTURAL TELEMETRY CONSOLE</text>
    <text x="22" y="26" class="mono header-sub">MICROARCHITECTURAL LATENCIES • LOCK-FREE CONCURRENCY • FORMAL VERIFICATION MATRIX</text>

    <!-- Top Right Sovereign Attestation -->
    <g transform="translate(680, 0)">
      <rect x="0" y="-4" width="270" height="28" rx="4" fill="rgba(0, 245, 212, 0.05)" stroke="rgba(0, 245, 212, 0.25)" stroke-width="1" />
      <text x="12" y="14" class="mono" font-size="9.5" fill="#94a3b8">ATTESTATION: <tspan fill="#00f5d4" font-weight="700">ED25519_VERIFIED</tspan></text>
    </g>
  </g>

  <!-- Horizontal Divider Line -->
  <line x1="24" y1="72" x2="976" y2="72" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- ==================== THREE COLUMN BENCHMARK PANELS ==================== -->

  <!-- PANEL 1: HARDWARE & CACHE HIERARCHY LATENCIES (x: 24, w: 300) -->
  <g transform="translate(24, 90)">
    <!-- Panel Header -->
    <rect x="0" y="0" width="300" height="420" rx="8" fill="rgba(255,255,255,0.015)" stroke="rgba(0, 245, 212, 0.2)" stroke-width="1" />
    <path d="M 0 0 L 300 0 L 300 32 L 0 32 Z" fill="rgba(0, 245, 212, 0.06)" rx="8" />
    <text x="14" y="21" class="mono panel-title">01 // CACHE LATENCY PHYSICS</text>

    <!-- Metric Item 1: CPU Registers -->
    <g transform="translate(14, 52)">
      <text y="0" class="mono metric-label">CPU Registers (AVX-512)</text>
      <text x="272" y="0" text-anchor="end" class="mono metric-val">0.8 ns</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="268" height="5" rx="2.5" fill="url(#cyanBar)" />
      <text y="24" class="mono metric-sub">Direct ALU execution • Zero bus contention</text>
    </g>

    <!-- Metric Item 2: L1 Data Cache -->
    <g transform="translate(14, 114)">
      <text y="0" class="mono metric-label">L1 Data Cache (32KB 8-way)</text>
      <text x="272" y="0" text-anchor="end" class="mono metric-val">1.2 ns</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="245" height="5" rx="2.5" fill="url(#cyanBar)" />
      <text y="24" class="mono metric-sub">Hit rate 99.4% • Cache-conscious DOD</text>
    </g>

    <!-- Metric Item 3: L2 Private Cache -->
    <g transform="translate(14, 176)">
      <text y="0" class="mono metric-label">L2 Cache (1MB 8-way)</text>
      <text x="272" y="0" text-anchor="end" class="mono metric-val">4.1 ns</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="210" height="5" rx="2.5" fill="url(#cyanBar)" />
      <text y="24" class="mono metric-sub">Local core thread-isolated cache boundary</text>
    </g>

    <!-- Metric Item 4: L3 Shared LLC -->
    <g transform="translate(14, 238)">
      <text y="0" class="mono metric-label">L3 Shared LLC (32MB Ring)</text>
      <text x="272" y="0" text-anchor="end" class="mono metric-val">14.6 ns</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="160" height="5" rx="2.5" fill="url(#cyanBar)" />
      <text y="24" class="mono metric-sub">Inter-core mesh crossbar synchronized</text>
    </g>

    <!-- Metric Item 5: Main Memory DRAM -->
    <g transform="translate(14, 300)">
      <text y="0" class="mono metric-label">Main Memory (DDR5-6000)</text>
      <text x="272" y="0" text-anchor="end" class="mono metric-val">56.4 ns</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="105" height="5" rx="2.5" fill="url(#cyanBar)" />
      <text y="24" class="mono metric-sub">Hardware pre-fetching • Aligned structs</text>
    </g>

    <!-- Metric Item 6: NVMe Async Ring -->
    <g transform="translate(14, 362)">
      <text y="0" class="mono metric-label">NVMe Async IOCP Queue</text>
      <text x="272" y="0" text-anchor="end" class="mono metric-val">18.2 µs</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="60" height="5" rx="2.5" fill="url(#cyanBar)" />
      <text y="24" class="mono metric-sub">Zero-copy Direct Memory Access (DMA)</text>
    </g>
  </g>

  <!-- PANEL 2: CONCURRENCY & RING BUFFER ENGINE (x: 350, w: 300) -->
  <g transform="translate(350, 90)">
    <rect x="0" y="0" width="300" height="420" rx="8" fill="rgba(255,255,255,0.015)" stroke="rgba(0, 187, 249, 0.2)" stroke-width="1" />
    <path d="M 0 0 L 300 0 L 300 32 L 0 32 Z" fill="rgba(0, 187, 249, 0.06)" rx="8" />
    <text x="14" y="21" class="mono panel-title" fill="#00bbf9">02 // LOCK-FREE DISRUPTOR RING</text>

    <!-- Metric 1: CAS Throughput -->
    <g transform="translate(14, 52)">
      <text y="0" class="mono metric-label">Sequencer CAS Throughput</text>
      <text x="272" y="0" text-anchor="end" class="mono metric-val" fill="#00bbf9">142.8M ops/s</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="270" height="5" rx="2.5" fill="url(#cyanBar)" />
      <text y="24" class="mono metric-sub">Atomic CAS • Zero mutex / thread sleep</text>
    </g>

    <!-- Metric 2: P99.999 Latency -->
    <g transform="translate(14, 114)">
      <text y="0" class="mono metric-label">P99.999 Latency Tail</text>
      <text x="272" y="0" text-anchor="end" class="mono metric-val" fill="#00bbf9">&lt; 11.8 ns</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="260" height="5" rx="2.5" fill="url(#cyanBar)" />
      <text y="24" class="mono metric-sub">Deterministic microsecond jitter bounds</text>
    </g>

    <!-- Metric 3: False-Sharing Padding -->
    <g transform="translate(14, 176)">
      <text y="0" class="mono metric-label">Cache False-Sharing</text>
      <text x="272" y="0" text-anchor="end" class="mono metric-val" fill="#00bbf9">0 (Zero Flushes)</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="url(#cyanBar)" />
      <text y="24" class="mono metric-sub">64-byte explicit padding per ring slot</text>
    </g>

    <!-- Metric 4: Mutex Contention -->
    <g transform="translate(14, 238)">
      <text y="0" class="mono metric-label">Mutex Lock Contention</text>
      <text x="272" y="0" text-anchor="end" class="mono metric-val" fill="#00bbf9">0.0000%</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="url(#cyanBar)" />
      <text y="24" class="mono metric-sub">100% Non-blocking wait-free consumer</text>
    </g>

    <!-- Metric 5: Heap Allocations -->
    <g transform="translate(14, 300)">
      <text y="0" class="mono metric-label">Hot-Path Heap Allocations</text>
      <text x="272" y="0" text-anchor="end" class="mono metric-val" fill="#00bbf9">0 B / op</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="url(#cyanBar)" />
      <text y="24" class="mono metric-sub">GC bypassed • Value-type pre-allocation</text>
    </g>

    <!-- Metric 6: SIMD Throughput -->
    <g transform="translate(14, 362)">
      <text y="0" class="mono metric-label">SIMD Parallel Lanes</text>
      <text x="272" y="0" text-anchor="end" class="mono metric-val" fill="#00bbf9">16x Float32 / clk</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="250" height="5" rx="2.5" fill="url(#cyanBar)" />
      <text y="24" class="mono metric-sub">AVX-512 FMA vector pipeline acceleration</text>
    </g>
  </g>

  <!-- PANEL 3: AXIOMS & FORMAL VERIFICATION MATRIX (x: 676, w: 300) -->
  <g transform="translate(676, 90)">
    <rect x="0" y="0" width="300" height="420" rx="8" fill="rgba(255,255,255,0.015)" stroke="rgba(121, 40, 202, 0.2)" stroke-width="1" />
    <path d="M 0 0 L 300 0 L 300 32 L 0 32 Z" fill="rgba(121, 40, 202, 0.06)" rx="8" />
    <text x="14" y="21" class="mono panel-title" fill="#a855f7">03 // INVARIANT VERIFICATION</text>

    <!-- Invariant 1 -->
    <g transform="translate(14, 52)">
      <text y="0" class="mono metric-label">§ I. Determinism</text>
      <text x="272" y="0" text-anchor="end" class="mono verified-tag">✓ VERIFIED</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="url(#purpleBar)" />
      <text y="24" class="mono metric-sub">Formally verified state transitions</text>
    </g>

    <!-- Invariant 2 -->
    <g transform="translate(14, 114)">
      <text y="0" class="mono metric-label">§ II. Mechanical Sympathy</text>
      <text x="272" y="0" text-anchor="end" class="mono verified-tag">✓ VERIFIED</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="url(#purpleBar)" />
      <text y="24" class="mono metric-sub">Silicon cache &amp; register direct mapping</text>
    </g>

    <!-- Invariant 3 -->
    <g transform="translate(14, 176)">
      <text y="0" class="mono metric-label">§ III. Zero-Cost Abstraction</text>
      <text x="272" y="0" text-anchor="end" class="mono verified-tag">✓ VERIFIED</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="url(#purpleBar)" />
      <text y="24" class="mono metric-sub">Compile-time resolution, zero penalty</text>
    </g>

    <!-- Invariant 4 -->
    <g transform="translate(14, 238)">
      <text y="0" class="mono metric-label">§ IV. Structural Invariance</text>
      <text x="272" y="0" text-anchor="end" class="mono verified-tag">✓ VERIFIED</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="url(#purpleBar)" />
      <text y="24" class="mono metric-sub">Immune to minification &amp; syntax drift</text>
    </g>

    <!-- Invariant 5 -->
    <g transform="translate(14, 300)">
      <text y="0" class="mono metric-label">§ V. Continuous Rigor</text>
      <text x="272" y="0" text-anchor="end" class="mono verified-tag">✓ VERIFIED</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="url(#purpleBar)" />
      <text y="24" class="mono metric-sub">Zero-defect execution across compute stack</text>
    </g>

    <!-- Test Suite Pass Rate -->
    <g transform="translate(14, 362)">
      <text y="0" class="mono metric-label">Test Suite Pass Rate</text>
      <text x="272" y="0" text-anchor="end" class="mono verified-tag" fill="#00f5d4">100.0% ZERO-DEFECT</text>
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="rgba(255,255,255,0.06)" />
      <rect x="0" y="8" width="272" height="5" rx="2.5" fill="url(#purpleBar)" />
      <text y="24" class="mono metric-sub">Automated CI/CD • Formal assertion matrix</text>
    </g>
  </g>

  <!-- Bottom Terminal Status Bar -->
  <g transform="translate(24, 526)">
    <text class="mono" font-size="10.5" fill="#64748b">
      CORE STATUS: <tspan fill="#00f5d4" font-weight="700">ONLINE</tspan> &#8226; TOTAL SUB-SYSTEMS: <tspan fill="#00bbf9" font-weight="700">8/8 OPTIMIZED</tspan> &#8226; ZERO-DEFECT BOUND: <tspan fill="#a855f7" font-weight="700">SATISFIED</tspan> &#8226; AUTHORITY: <tspan fill="#f8fafc" font-weight="700">ABDELRAHMAN AYMAN</tspan>
    </text>
  </g>
</svg>
